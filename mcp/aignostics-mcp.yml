summary: >-
  Aignostics ships a runnable MCP server inside its Python SDK. `aignostics mcp run` starts a
  FastMCP server over stdio transport (MCP_TRANSPORT = "stdio" in utils/_mcp.py) named
  "Central Aignostics MCP Server", and `aignostics mcp list-tools` prints the discovered tool set.
  It was introduced in SDK v1.1.0 (2026-02-10, "central MCP server with auto-discovery of plugin
  tools"). There is NO remote/hosted MCP endpoint - nothing for an agent to POST to without a
  local install - and the customer-facing guide has been withdrawn.
findings:
- id: no-remote-endpoint
  detail: >-
    No hosted MCP URL is published anywhere on aignostics.com, platform.aignostics.com or the
    documentation. A human must install the Python SDK and authenticate a device-code OAuth session
    before any agent can reach the platform through MCP.
- id: guide-withdrawn
  detail: >-
    The README block describing the MCP server is commented out with the note "Hidden for now: the
    MCP server is not yet usable for customers", and
    https://aignostics.readthedocs.io/en/latest/get_started_mcp.html returns HTTP 404. The code
    ships in the published PyPI distribution regardless.
- id: zero-first-party-tools-in-tree
  detail: >-
    mcp_create_server() mounts every FastMCP instance found by locate_implementations(FastMCP)
    across the aignostics package and any installed plugin entry points. No FastMCP instance is
    defined anywhere in the SDK's own modules (application, bucket, dataset, platform, qupath,
    system, wsi, utils were each checked), so a stock install exposes the mount machinery and no
    first-party tools. The tool surface is therefore a runtime property of which plugins are
    installed, not a published manifest - it cannot be enumerated without installing and running.
transport: stdio
discovery:
  mechanism: uv run aignostics mcp list-tools
  note: runtime enumeration only; no static tool manifest is published
