versioning:
  api:
    style: path
    current: v1
    spec_version_observed: 1.8.0
    observed_at: '2026-09-14'
    note: >-
      The URI major version is v1. The OpenAPI info.version moves independently and is not surfaced
      in any response header - the copy vendored in the SDK repo at
      docs/source/_static/openapi_v1.json was still 1.4.0 with 14 operations on the day the live
      document served 1.8.0 with 26. A consumer generating a client from the repo copy gets a client
      that is missing the entire /v1/access grant and share-token surface and all four application
      version document operations.
  sdk:
    style: semver
    current: 1.5.0
    released: '2026-08-13'
  applications:
    style: semver per application version
    note: >-
      Computational pathology applications carry their own semantic versions. POST /v1/runs takes an
      optional version_number; omitting it selects "the latest version available to you", so an
      unpinned submission is not reproducible across an application release. Pin version_number for
      any workflow whose results must be comparable over time.
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  deprecated_operations: []
  detail: >-
    No deprecation policy, no RFC 8594 Sunset/Deprecation headers, and no operation in the 26-operation
    contract carries `deprecated: true`. The release notes announce additions and fixes but record no
    removals or deprecation notices. Nothing tells a consumer how much notice they would get.
