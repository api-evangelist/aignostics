aid: aignostics
name: Aignostics
description: 'Aignostics GmbH is a Berlin-based computational pathology company, spun out of Charite Universitaetsmedizin
  Berlin, that builds AI foundation models and analysis applications for whole slide images (WSI). Its
  commercial surface is the Aignostics Platform, a cloud service that runs computational pathology applications
  - Atlas H&E-TME tumor-microenvironment profiling is the flagship - on dedicated NVIDIA GPU infrastructure,
  with a per-organization Google Cloud Storage bucket and Auth0-backed enterprise SSO. The Platform is
  reachable three ways: a browser Console, an open-source Python SDK (Launchpad desktop app, CLI, client
  library and an in-development MCP server), and a public REST contract - the Aignostics Platform API,
  an OpenAPI 3.1.0 document with 26 operations served unauthenticated at https://platform.aignostics.com/api/v1/openapi.json.
  The API covers application and version discovery, run submission and cancellation, per-item result and
  artifact retrieval, custom metadata with checksum-guarded writes, and an access-grant / share-token
  sharing model. Access is organization-scoped: there is no anonymous access and no organization-wide
  API key.'
