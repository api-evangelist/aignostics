domain_standards:
- id: dicom
  name: DICOM (Digital Imaging and Communications in Medicine)
  conforms: true
  signature: media-type-declaration
  evidence: >-
    The contract declares application/dicom as an accepted input artifact MIME type (alongside
    application/zip for zipped DICOM, application/octet-stream for Aperio .svs, and image/tiff), in
    the InputArtifactCreationRequest documentation table of
    openapi/aignostics-platform-api-openapi.json. The Python SDK ships a
    src/aignostics/wsi/_pydicom_handler.py alongside an OpenSlide handler, and the org publishes a
    fork of dicom-microscopy-viewer.
  note: >-
    DICOM is the interoperability standard for this market. A pathology lab whose slide scanner
    already emits DICOM WSI can submit its native output with no conversion layer; a provider
    accepting only vendor formats would require a bilateral connector.
- id: ivdr
  name: EU In Vitro Diagnostic Medical Devices Regulation (EU) 2017/746
  conforms: declared-per-application
  signature: contract-field
  evidence: >-
    ApplicationReadResponse.regulatory_classes - "Regulatory classes, to which the applications
    comply with. Possible values include: RUO, IVDR, FDA." The example value in the spec is ["RUO"].
  note: >-
    The regulatory class is a per-application, per-version property returned by the API itself, not a
    company-wide claim, and the platform is explicit that an application may be Research Use Only.
    This is recorded as a contract signature - the API models regulatory classification as
    first-class data - not as an assertion that any particular Aignostics application is IVDR-marked.
    A caller must read regulatory_classes at runtime before using a result clinically.
