summary: >-
  No request-rate limit is published and none is signalled at runtime. The contract declares no 429
  response on any of its 26 operations, no Retry-After, and no RateLimit-* or X-RateLimit-* response
  header; the documentation states no per-key or per-account request ceiling. The only throttle that
  exists in the contract is a commercial quota on work submitted, not on requests made.
