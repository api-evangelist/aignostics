  title: Payment Required - quota exceeded
  detail: A quota limit (slides per run, or monthly slides) would be exceeded by this run
  operations:
  - create_run_v1_runs_post
  meaning: >-
    The commercial throttle. This is the only exhaustion signal the API defines - there is no 429 and
    no Retry-After anywhere in the contract.
  remediation: >-
    Reduce the number of slides in the run, wait for the monthly quota to reset, or contact the
    account manager to raise the entitlement. The numeric limits are not published.
  retryable: false
- status: 403
  title: Forbidden - insufficient permission on the addressed resource
  operations_count: 15
  meaning: >-
    Authenticated but not entitled. The description is resource-specific in 15 distinct phrasings
    ("You don't have permission to cancel this run", "...to download this artifact", "...to grant
    access to this resource"), which makes the spec readable but gives the client no discriminator
    beyond the status code.
  remediation: >-
    Confirm the caller's organization owns the resource, or that an active grant or a valid
    share_token covers it. Request a viewer grant via POST /v1/access/grants from an account that
    owns the run.
  retryable: false
- status: 404
  title: Not Found
  operations_count: 21
  meaning: >-
    The addressed application, application version, run, item, artifact, document, grant or share
    token does not exist OR is not visible to the caller - the contract deliberately conflates the
    two in several phrasings ("Application version with given ID is not available to you or does not
    exist"), which is a sound anti-enumeration posture. One variant carries real information:
    "Run not found because it was deleted."
  remediation: >-
    Re-list the parent collection to confirm the identifier, and check entitlement before assuming
    the resource is gone.
  retryable: false
- status: 409
