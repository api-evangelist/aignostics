gaps:
- id: no-error-codes
  detail: >-
    The API publishes no stable machine-readable error code registry. There is nothing to switch on
    but HTTP status, and 403 (15 variants) and 404 (21 variants) each collapse many distinct causes
    into one code.
- id: not-rfc9457
  detail: >-
    No application/problem+json. Adopting RFC 9457 - a type URI plus a code per condition - would make
    every one of the 15 forbidden variants and 13 not-found variants individually actionable by an
    agent without string-matching English prose.
- id: plain-text-401
  detail: >-
    The live gateway answers an unauthenticated request with the plain-text body "Jwt is missing"
    rather than any JSON envelope, so even the 401 a client is most likely to hit is unparseable.
