pointer_reason: >-
  No WellKnown and no SecurityTxt pointer is wired into apis.yml. Aignostics' own hosts serve no
  discovery document at all: the registrable domain 404s every /.well-known/* path, the Platform host
  gates every path behind an Auth0 session, and the portal host is an SPA catch-all that fails the
  negative control. The only documents that returned 200 are the OIDC/RFC 8414 metadata and JWKS that
  Auth0 serves automatically for every tenant on its own domain - real, and genuinely the
  authorization server this API points at, but not a surface Aignostics publishes. Crediting it as
  one would be crediting the identity vendor's default. Recorded as evidence in
  conformance/aignostics-conformance.yml and authentication/aignostics-authentication.yml instead.
