notes: >-
  The registrable domain (aignostics.com / www.aignostics.com) is a Webflow site that answers every
  /.well-known/* request with an 88-byte "Invalid .well-known request" page (HTTP 404) and every other
  unknown path with the 404 marketing shell - no discovery documents are served there. The Platform
  host (platform.aignostics.com) sits behind an Auth0 session gate that 307s every unauthenticated
  path, including /.well-known/*, to /auth0-api/auth/login, so no anonymous discovery document is
  reachable on it either. The only real discovery documents Aignostics serves are on its dedicated
  Auth0 tenant, aignostics-platform.eu.auth0.com - the authorization server the published OpenAPI
  securityScheme points at - which returns a valid RFC 8414 / OIDC discovery document and a JWKS.
  portal.aignostics.com is an SPA catch-all: it answered HTTP 200 with an identical 568-byte HTML
  shell for every path probed, INCLUDING the negative control, so every hit on that host is discarded.
path_echo_control: failed-on-portal-host-only
