identifiers:
  scheme: opaque
  prefixes_published: false
  caller_supplied:
  - field: external_id
    entity: Item
    constraint: must be unique within a run; a duplicate is rejected with 400
  note: >-
    No id-prefix convention (no run_, item_ style prefixes) is documented, so an identifier carries
    no type information. external_id is the only join key a caller controls and is therefore the
    only durable link back to a caller's own case or specimen record.
enumerations:
  count: 14
  note: >-
    The contract is enum-heavy and consistently so - PENDING/PROCESSING/TERMINATED is reused for
    Run, Item and OutputArtifact state, and SUCCEEDED/USER_ERROR/SYSTEM_ERROR/SKIPPED for Item and
    Artifact termination. A client can write one state machine and apply it at three levels.
