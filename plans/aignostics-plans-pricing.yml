summary: >-
  Aignostics publishes no prices, no tiers, no per-slide rate and no quota figures. The site has no
  /pricing page at all - https://www.aignostics.com/pricing returns HTTP 404 and no pricing URL
  appears in the sitemap. Access is organization-level: "Organizations subscribe to the Aignostics
  Platform and receive dedicated infrastructure including a Google Cloud Storage bucket and API
  access", and the API getting-started guide says an organization must "first be registered by our
  business support team" with a client_id issued by support@aignostics.com. A quota exists and is
  enforced in the contract - POST /v1/runs returns 402 Payment Required when "a quota limit (slides
  per run, or monthly slides) would be exceeded" - but neither number is published anywhere.
